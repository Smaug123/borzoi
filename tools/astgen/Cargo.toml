[package]
name = "borzoi-astgen"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Code generator for the borzoi-cst typed-AST facades and language-feature table."

# A sibling tool, never a dependency of the crate it generates, so nothing here
# reaches `borzoi-cst`'s dependency closure. `syn` reads the accessor
# signatures out of `crates/cst/src/syntax/union.rs` for the union's lock.
[dependencies]
borzoi-spawn.workspace = true
syn.workspace = true
