      - name: Gate on the LSP parser corpus sweep
        if: steps.gate.outputs.run == 'true'
        # The "a server stays alive whatever the user opens" guarantee: the raw
        # parser may panic on real F#, and `parse_diagnostics` must catch every
        # one. It walks `BORZOI_CORPUS`, which `nix develop` sets, so it really
        # sweeps here rather than skipping for want of a sibling checkout.
        env:
          BORZOI_FCS_DUMP: ${{ runner.temp }}/fcs-dump-bundle/fcs-dump
        run: |
