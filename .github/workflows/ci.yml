  corpus-diff:
    name: Whole-project resolution
    runs-on: ubuntu-latest
    # Raised from 60 when the whole-assembly projection sweep joined this job.
    timeout-minutes: 75
    # Deliberately ungated by `changes`: the runtime path this exercises spans
    # cst, sema, assembly, msbuild, nuget and lsp together, so a filter narrow
    # enough to be worth having would be one wrong entry away from skipping the
    # gate silently. The job is ~4 minutes.
    env:
      # The divergences this corpus is known to produce, per comparison. A
      # **two-sided** record: a run that diverges more fails, and so does one
      # that diverges less, so a fix cannot land without bringing the number
      # down with it and a one-sided ceiling cannot quietly decay into a rubber
      # stamp. Per category rather than a total, because a change that trades a
      # project wrong target for an assembly one moves the total by zero.
      #
      # Lowering it is the good direction and needs no ceremony beyond the diff
      # that earns it. Raising it means this corpus now resolves something to
      # the wrong declaration and wants a reason in the commit message.
      #
      # **Zero, in every direction.** Both sides read one reference set — ours,
      # netstandard's BCL included — so neither can resolve a name in an
      # assembly the other cannot see, and the oracle's compiler-generated
      # values (a destructuring pattern's synthetic parameter, whose use spans
      # the pattern) are skipped rather than compared against the case the
      # author actually wrote. Raising any of these means this corpus now
      # resolves something to the wrong declaration and wants a reason in the
      # commit message.
      BORZOI_PROJECT_EXPECT_DIVERGENCES: "assembly=0,project=0,reverse=0"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Move /nix and cargo's target/ to the large /mnt disk
        run: |
          df -h / /mnt || true
          sudo mkdir -p /mnt/nix /nix
          sudo mount --bind /mnt/nix /nix
          sudo mkdir -p /mnt/cargo-target
          sudo chown "$(id -u):$(id -g)" /mnt/cargo-target
          mkdir -p "$GITHUB_WORKSPACE/target"
          sudo mount --bind /mnt/cargo-target "$GITHUB_WORKSPACE/target"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache cargo target/
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cmd-format: nix develop -c {0}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Materialise the pinned project corpus
        run: bash tools/ci/project-corpus.sh

      - name: Gate on whole-project resolution
        # The exit code *is* the gate here, which is the whole difference from
        # `stats.yml`'s job: that one records the same numbers into the series
        # and deliberately ignores this status, so without this job nothing ever
        # asserted on them at a decision point.
        run: |
          summary="$RUNNER_TEMP/project-corpus-summary.json"
          nix develop --command env \
            BORZOI_PROJECT_LIST="$BORZOI_PROJECT_LIST" \
            BORZOI_PROJECT_SUMMARY_JSON="$summary" \
            cargo run --locked -p borzoi-corpus-diff
          # A run that measured less than the whole corpus can satisfy the
          # expectation by not looking, so assert the coverage separately.
          comparable="$(jq -er '.statistics.projects.comparable' "$summary")"
          if [ "$comparable" -ne "$BORZOI_PROJECT_PINNED" ]; then
            echo "only $comparable of $BORZOI_PROJECT_PINNED pinned projects became comparable" >&2
            exit 1
          fi

      - name: Gate on whole-assembly projection losses
        # This sweep wants a populated package cache rather than a fixture,
        # which is why it had been left a local ratchet — but the step above
        # has just restored the pinned corpus into exactly one, so the input it
        # needs already exists on this runner and costs nothing more to reach.
        #
        # A whole-assembly skip is the grade of failure that invalidates
        # readings into *other* assemblies too (the missing one could declare a
        # colliding type or an assembly-level `[<AutoOpen>]`), so any loss
        # without a named exemption fails. Losses are identified by the file's
        # bytes, never its path, so the cache layout here cannot perturb a
        # verdict.
        #
        # Measured 2026-07-31 against this exact restore: 1124 assemblies found,
        # 1118 projected, 6 exempt (native PE), 0 dropped types. The sweep's own
        # `MIN_PROJECTED = 1_000` anti-vacuity floor exists to catch a mistyped
        # root, and this population clears it by 118 — thin enough that a corpus
        # bump which drops a few dependencies could fail this step for a reason
        # that has nothing to do with projection. If it goes red with
        # "population too small" after a `nix/project-corpus.json` change, that
        # is what happened; re-measure rather than assuming a projection defect.
        run: |
          nix develop --command env \
            BORZOI_DLL_SWEEP_ROOT="$RUNNER_TEMP/project-corpus-packages" \
            cargo test -p borzoi-assembly --test all projection_skip_sweep:: \
            -- --ignored --nocapture

  all-required-checks-complete:
    if: ${{ always() }}
    needs:
      - changes
      - corpus-diff
      - lint
      - fcs-dump
      - test-cst
      - test-msbuild
      - test-nuget
      - test-astgen
      - test-stats
      - test-assembly
      - test-sema
      - test-lsp
      - test-sidecar
      - test-spawn
      - test-oracle-harness
      - nix-build
    runs-on: ubuntu-latest
    steps:
      - uses: G-Research/common-actions/check-required-lite@901acf923ac37b7f61777c210cb5145c2d9f489a
        with:
          needs-context: ${{ toJSON(needs) }}
