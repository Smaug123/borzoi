[package]
name = "borzoi-cst"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
logos.workspace = true
rowan = { workspace = true, optional = true }
text-size.workspace = true

[features]
# Records which typed-AST accessors a computation reads
# (`syntax::accessor_trace`). Test-only: the parser differential uses it to
# check that its projection reads every accessor `borzoi-sema` and the LSP
# read. The self-reference in `[dev-dependencies]` turns it on for this
# crate's own tests.
accessor-trace = []
# Drives rowan's green-tree builder beside the syntax table's, asserts on
# every parse that the two trees are the same, and keeps the green tree for
# the rowan reference differential (`tests/all/flat_tree_reference.rs`).
# Test-only, on for this crate's own tests through the self-reference below.
rowan-reference = ["dep:rowan"]
# Asserts on every lex that the raw token table rebuilds exactly the stream of
# the full-trivia driver iterator, which runs the same preprocessor through a
# queue (`docs/token-pipeline-soa-plan.md`, D7).
# Test-only, on for this crate's own tests through the self-reference below.
token-reference = []

[dev-dependencies]
borzoi-cst = { path = ".", features = ["accessor-trace", "rowan-reference", "token-reference"] }
borzoi-oracle-harness.workspace = true
# The metric-path walk the stats dashboard plots by, so a generator's
# pinned metric namespace is read exactly as it is published.
borzoi-stats.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
tempfile.workspace = true
# Parses `src/syntax/mod.rs` and the consumers' sources for the accessor
# coverage check (`tests/all/accessor_coverage.rs`).
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
