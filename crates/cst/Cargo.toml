[package]
name = "borzoi-cst"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
logos.workspace = true
rowan = { workspace = true, optional = true }
text-size.workspace = true

[features]
# Records which typed-AST accessors a computation reads
# (`syntax::accessor_trace`). Test-only: the parser differential uses it to
# check that its projection reads every accessor `borzoi-sema` and the LSP
# read. The self-reference in `[dev-dependencies]` turns it on for this
# crate's own tests.
accessor-trace = []
# Drives rowan's green-tree builder beside the syntax table's, asserts on
# every parse that the two trees are the same, and keeps the green tree for
# the rowan reference differential (`tests/all/flat_tree_reference.rs`).
# Test-only, on for this crate's own tests through the self-reference below.
rowan-reference = ["dep:rowan"]
# Asserts on every lex that the raw token table rebuilds exactly the stream of
# the full-trivia driver iterator, which runs the same preprocessor through a
# queue (`docs/token-pipeline-soa-plan.md`, D7).
# Test-only, on for this crate's own tests through the self-reference below.
token-reference = []
# Exports the union typed facade (`syntax::{ImplFile, Expr, Pat, Type,
# ModuleDecl, …}`) and each facade's `to_union` escape back to it. The union is the maximal, every-version surface and gains a variant
# whenever a construct is modelled, so it carries no stability promise; without
# this feature `syntax` exports only the untyped substrate (`SyntaxNode`,
# `SyntaxKind`, `AstNode`, the `projection` gate) and whichever per-version
# facades below are on. `borzoi-sema`, the LSP and
# `borzoi-corpus-diff` turn it on, and this crate's own tests through the
# self-reference below. CI's lint job builds the crate without it.
unstable-union = []
# The per-version typed facades, `syntax::v4_6` … `syntax::v11`
# (`docs/ast-versioning-plan.md` D4, D8): each owns every node type and enum
# of its language version's surface, and `Parse::view` reads a parse through
# one. A version whose surface equals an earlier one's is an alias of it
# (`pub use super::<earlier>::*`), and its feature also compiles, and so
# exposes, the module it aliases. The facades up to `v10` are published, so
# frozen: their surfaces only grow (`crates/cst/facades/`,
# `docs/ast-versioning-plan.md` D6). `borzoi-sema` and the LSP use the union
# and turn none on; this crate's own tests turn all on.
v4_6 = []
v4_7 = []
v5 = []
v6 = []
v7 = []
v8 = []
v9 = []
v10 = []
v11 = []
# `syntax::preview`, the facade of FCS's `preview` version. It is never frozen:
# its lock is regenerated whenever the union moves.
unstable-preview = []

[dev-dependencies]
borzoi-cst = { path = ".", features = [
    "accessor-trace",
    "rowan-reference",
    "token-reference",
    "unstable-union",
    "v4_6",
    "v4_7",
    "v5",
    "v6",
    "v7",
    "v8",
    "v9",
    "v10",
    "v11",
    "unstable-preview",
] }
borzoi-oracle-harness.workspace = true
# The feature table's parser, so `tests/all/language_features.rs` reads
# `language-features.tsv` exactly as the generator does.
borzoi-astgen.workspace = true
# The metric-path walk the stats dashboard plots by, so a generator's
# pinned metric namespace is read exactly as it is published.
borzoi-stats.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
tempfile.workspace = true
# Parses `src/syntax/union.rs` and the consumers' sources for the accessor
# coverage check (`tests/all/accessor_coverage.rs`).
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
