[package]
name = "borzoi-nuget"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
roxmltree.workspace = true

[dev-dependencies]
# The resident `nuget-oracle` driver (`BatchChild`) and the bounded one-shot
# `dotnet build` driver (`BoundedCommand`, re-exported from `borzoi-spawn`),
# so every wait on a child runs under a deadline and every launch takes the one
# process-global spawn lock.
borzoi-oracle-harness.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
