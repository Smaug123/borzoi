[workspace]
resolver = "2"
members = [
    "crates/assembly",
    "crates/corpus-diff",
    "crates/cst",
    "crates/lsp",
    "crates/msbuild",
    "crates/nuget",
    "crates/oracle-harness",
    "crates/sema",
    "crates/spawn",
    "tools/astgen",
    "tools/stats",
]

[workspace.package]
license = "MIT OR Apache-2.0"

# Every dependency's version requirement lives here, once; members inherit it
# with `<dep>.workspace = true` and add `optional` or extra features locally.
# A member cannot turn default features back *off*, so a dependency that must
# be built without them says so here.
[workspace.dependencies]
borzoi = { path = "crates/lsp" }
borzoi-assembly = { path = "crates/assembly" }
borzoi-cst = { path = "crates/cst" }
borzoi-msbuild = { path = "crates/msbuild" }
borzoi-oracle-harness = { path = "crates/oracle-harness" }
borzoi-sema = { path = "crates/sema" }
borzoi-spawn = { path = "crates/spawn" }
borzoi-stats = { path = "tools/stats" }

bincode = "1.3"
ena = "0.14"
# Pure-Rust deflate via miniz_oxide. `default-features = false` plus the
# `rust_backend` feature avoids dragging in `libz-sys` / native zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
logos = "0.16"
lsp-server = "0.10"
lsp-types = "0.97"
# `https-rustls` is rustls with the bundled `webpki-roots` trust store (no
# OpenSSL, no system libraries). minreq requests rustls's default features, so
# the crypto provider is `aws-lc-rs`, whose `aws-lc-sys` compiles vendored C
# with `cc`. The root store is compiled in: a CA distrust only reaches the
# binary through a `webpki-roots` bump.
minreq = { version = "3", features = ["https-rustls"] }
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
# Default features off: no TLS backend or async client; the LSP picks its
# transport explicitly.
opentelemetry-otlp = { version = "0.32", default-features = false }
opentelemetry_sdk = "0.32"
proc-macro2 = "1"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
roxmltree = "0.21"
rowan = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
url = "2"

# The whole-project corpus gate (`tools/ci/project-corpus-gate.sh`) asks the
# LSP's request handlers tens of thousands of questions, which unoptimised takes
# the better part of half an hour. Optimised, but keeping the debug assertions
# and overflow checks a test build has: the gate is a test, and an assertion
# the handlers make is part of what it checks.
[profile.gate]
inherits = "release"
debug-assertions = true
overflow-checks = true
