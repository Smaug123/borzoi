[workspace]
resolver = "2"
members = [
    "crates/assembly",
    "crates/corpus-diff",
    "crates/cst",
    "crates/lsp",
    "crates/msbuild",
    "crates/nuget",
    "crates/oracle-harness",
    "crates/sema",
    "crates/spawn",
    "tools/astgen",
    "tools/stats",
]

[workspace.package]
license = "MIT OR Apache-2.0"

# Every dependency's version requirement lives here, once; members inherit it
# with `<dep>.workspace = true` and add `optional` or extra features locally.
# A member cannot turn default features back *off*, so a dependency that must
# be built without them says so here.
[workspace.dependencies]
borzoi = { path = "crates/lsp" }
borzoi-assembly = { path = "crates/assembly" }
borzoi-astgen = { path = "tools/astgen" }
borzoi-cst = { path = "crates/cst" }
borzoi-msbuild = { path = "crates/msbuild" }
borzoi-nuget = { path = "crates/nuget" }
borzoi-oracle-harness = { path = "crates/oracle-harness" }
borzoi-sema = { path = "crates/sema" }
borzoi-spawn = { path = "crates/spawn" }
borzoi-stats = { path = "tools/stats" }

# A bounded channel for the LSP's input buffer (`borzoi::server::buffer_input`);
# already in the tree through `lsp-server`, whose `Connection` carries its
# channels.
crossbeam-channel = "0.5"
ena = "0.14"
# Pure-Rust deflate via miniz_oxide. `default-features = false` plus the
# `rust_backend` feature avoids dragging in `libz-sys` / native zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
foldhash = "0.2"
logos = "0.16"
lsp-server = "0.10"
lsp-types = "0.97"
# `https-rustls` is rustls with the bundled `webpki-roots` trust store (no
# OpenSSL, no system libraries). minreq requests rustls's default features, so
# the crypto provider is `aws-lc-rs`, whose `aws-lc-sys` compiles vendored C
# with `cc`. The root store is compiled in: a CA distrust only reaches the
# binary through a `webpki-roots` bump.
minreq = { version = "3", features = ["https-rustls"] }
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
# Default features off: no TLS backend or async client; the LSP picks its
# transport explicitly.
opentelemetry-otlp = { version = "0.33", default-features = false }
opentelemetry_sdk = "0.33"
# `use-std` without the default `heapless` support: the cache only needs
# `Vec`-backed encode and slice decode.
postcard = { version = "1", default-features = false, features = ["use-std"] }
proc-macro2 = "1"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
quote = "1"
# 0.21.2 parses nested elements iteratively; earlier versions recurse once per
# level, so a deeply nested project file or nuspec aborts the process.
roxmltree = "0.21.2"
self_cell = "1.2"
rowan = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
text-size = "1.1"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = "0.3"
url = "2"

# Third-party crates are optimised in dev and test builds; the workspace's own
# crates are not. The test suites spend much of their CPU in dependency code
# (hashbrown, logos, and rowan, whose green trees the cst tests build as a
# reference), which unoptimised runs several times slower. The workspace's
# crates keep `opt-level = 0`, and with it the frames of the recursive walks
# the walk-stack tests bound. Debug
# assertions and overflow checks stay on everywhere: `opt-level` changes
# neither.
[profile.dev.package."*"]
opt-level = 1

# The whole-project corpus gate (`tools/ci/project-corpus-gate.sh`) asks the
# LSP's request handlers tens of thousands of questions, which unoptimised takes
# the better part of half an hour. Optimised, but keeping the debug assertions
# and overflow checks a test build has: the gate is a test, and an assertion
# the handlers make is part of what it checks.
[profile.gate]
inherits = "release"
debug-assertions = true
overflow-checks = true
